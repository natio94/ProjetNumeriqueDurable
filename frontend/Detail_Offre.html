<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe &mdash; D&eacute;tail d'une offre</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a1a; font-size: 14px; }

  .nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; border-bottom: 1px solid #dde1e7; }
  .nav-logo { font-size: 15px; font-weight: 600; }
  .btn { padding: 7px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid #ccc; background: transparent; color: #444; }
  .btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  .breadcrumb { padding: 10px 24px; font-size: 12px; color: #888; }
  .breadcrumb a { color: #555; text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }

  .main { max-width: 860px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
  @media (max-width: 720px) { .main { grid-template-columns: 1fr; } }

  .info-block { background: #fff; border: 1px solid #dde1e7; border-radius: 8px; padding: 20px; }
  .offer-price { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .offer-title { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tag { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: #ebeef2; color: #666; border: 1px solid #dde1e7; }
  .divider { height: 1px; background: #e0ddd5; margin: 14px 0; }
  .offer-desc { font-size: 13px; color: #555; line-height: 1.7; margin-bottom: 16px; }
  .btn-contact { width: 100%; padding: 12px; font-size: 14px; font-weight: 500; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; cursor: pointer; }

  .seller-card { background: #fff; border: 1px solid #dde1e7; border-radius: 8px; padding: 16px; margin-top: 16px; }
  .seller-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #d5e8f5; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #1a5a8a; flex-shrink: 0; }
  .seller-name { font-weight: 600; font-size: 14px; }
  .seller-sub { font-size: 11px; color: #888; margin-top: 2px; }
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-logo" style="cursor:pointer" onclick="window.location='01_accueil.html'">RecycloMarché</span>
  <div>
    <button class="btn" onclick="window.location='02_liste_offres.html'">&larr; Retour aux offres</button>
  </div>
</nav>

<div class="breadcrumb">
  <a href="01_accueil.html">Accueil</a> &rsaquo; <span id="breadcrumb-cat"></span> &rsaquo; <span id="breadcrumb-title">&hellip;</span>
</div>

<div class="main" id="main-content" style="display:none">
  <div>
    <div class="info-block">
      <div class="offer-price" id="offer-price"></div>
      <div class="offer-title" id="offer-title"></div>
      <div class="tags" id="offer-tags"></div>
      <div class="divider"></div>
      <div class="offer-desc" id="offer-desc"></div>
      <button class="btn-contact">Contacter le vendeur</button>
    </div>

    <div class="seller-card">
      <div class="seller-header">
        <div class="avatar" id="seller-avatar"></div>
        <div>
          <div class="seller-name" id="seller-name"></div>
          <div class="seller-sub" id="seller-loc"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<p id="msg-statut" style="text-align:center;padding:40px;color:#888;font-size:13px;">Chargement de l'offre&hellip;</p>

<script src="../backend/api/api.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get('id');

  function afficherErreur(msg) {
    const p = document.getElementById('msg-statut');
    p.style.color = '#c00';
    p.textContent = msg;
  }

  if (!id) {
    afficherErreur('Aucune offre sélectionnée. Revenez à la liste des offres.');
  } else {
    getOffresById( id ).then(data => {
      if (!data.length) { afficherErreur('Offre introuvable.'); return; }
      const o = data[0];

      document.getElementById('offer-price').textContent = o.price + ' €';
      document.getElementById('offer-title').textContent = o.title;
      document.getElementById('offer-desc').textContent = o.description;

      const tags = document.getElementById('offer-tags');
      [o.categorie, o.postal_code].filter(Boolean).forEach(t => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = t;
        tags.appendChild(span);
      });

      const initiales = ((o.prenom||'')[0]||'') + ((o.nom||'')[0]||'');
      document.getElementById('seller-avatar').textContent = initiales.toUpperCase();
      document.getElementById('seller-name').textContent = (o.prenom||'') + ' ' + (o.nom ? o.nom[0]+'.' : '');
      document.getElementById('seller-loc').textContent = o.postal_code || '';
      document.getElementById('breadcrumb-cat').textContent = o.categorie || '';
      document.getElementById('breadcrumb-title').textContent = o.title;

      // Bouton contacter
      document.querySelector('.btn-contact').onclick = () => {
        const user = getSession();
        if (!user) { window.location = 'Connexions_Inscriptions.html'; return; }
        alert('Message envoyé à ' + (o.prenom || 'le vendeur') + ' !\n(fonctionnalité de messagerie à connecter au backend)');
      };

      document.getElementById('msg-statut').style.display = 'none';
      document.getElementById('main-content').style.display = 'grid';
    }).catch(() => afficherErreur("Impossible de charger l'offre."));
  }
</script>

</body>
</html>
